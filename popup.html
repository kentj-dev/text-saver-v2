<!-- KENT J 2020 -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Format Saver by Kent J.</title>
    <link rel="stylesheet" type="text/css" href="static/js/driverjs/driver.css" />
    <link rel="stylesheet" type="text/css" href="static/css/popup.css" />
  </head>
  <body>
    <main class="main-wrapper">
      <div class="content">
        <header class="app-header">
          <div class="brand">
            <img src="images/128.png" alt="Text Saver logo" class="logo" />
            <div class="extension-info">Text Saver</div>
          </div>
          <div class="header-right">
            <span id="save-status" class="save-status" role="status"></span>
            <button
              id="theme-toggle"
              class="header-action theme-toggle"
              type="button"
              title="Switch to light mode"
              aria-label="Switch to light mode"
              aria-pressed="false"
            >
              <img id="theme-icon" class="icon" src="static/svgs/sun.svg" alt="" aria-hidden="true" />
            </button>
            <button id="find-in-tab" class="header-action" type="button" title="Find in tab" aria-label="Find in tab">
              <img class="icon" src="static/svgs/search.svg" alt="" aria-hidden="true" />
            </button>
            <div id="header-actions" class="header-actions">
              <button
                id="protect-tab"
                class="header-action"
                type="button"
                title="Set password"
                aria-label="Set password"
              >
                <img id="protect-tab-icon" class="icon" src="static/svgs/lock.svg" alt="" aria-hidden="true" />
              </button>
              <button id="rename-tab" class="header-action" type="button" title="Rename tab" aria-label="Rename tab">
                <img class="icon" src="static/svgs/settings.svg" alt="" aria-hidden="true" />
              </button>
              <button id="delete-tab" class="header-action" type="button" title="Delete tab" aria-label="Delete tab">
                <img class="icon" src="static/svgs/trash.svg" alt="" aria-hidden="true" />
              </button>
            </div>
            <div id="overflow-wrapper" class="overflow-wrapper">
              <button
                id="overflow-toggle"
                class="header-action"
                type="button"
                title="More options"
                aria-label="More options"
                aria-haspopup="menu"
                aria-expanded="false"
              >
                <img class="icon" src="static/svgs/ellipses.svg" alt="" aria-hidden="true" />
              </button>
              <div id="overflow-menu" class="overflow-menu" role="menu" hidden>
                <button id="start-guide" class="overflow-item" type="button" role="menuitem">
                  <img class="overflow-icon" src="static/svgs/shapes.svg" alt="" aria-hidden="true" />
                  Guide
                </button>
                <button id="export-backup" class="overflow-item" type="button" role="menuitem">
                  <img class="overflow-icon" src="static/svgs/export.svg" alt="" aria-hidden="true" />
                  Export backup
                </button>
                <button id="import-backup" class="overflow-item" type="button" role="menuitem">
                  <img class="overflow-icon" src="static/svgs/import.svg" alt="" aria-hidden="true" />
                  Import backup
                </button>
                <a
                  class="overflow-item"
                  href="https://bit.ly/4xDbvkk"
                  target="_blank"
                  rel="noopener noreferrer"
                  role="menuitem"
                >
                  <img class="overflow-icon" src="static/svgs/sparkle.svg" alt="" aria-hidden="true" />
                  Developer
                </a>
              </div>
            </div>
            <input id="backup-file" type="file" accept="application/json,.json" hidden />
          </div>
        </header>
        <div class="tabs-toolbar">
          <div id="tabs" class="tabs" role="tablist" aria-label="Saved text tabs"></div>
          <button id="add-tab" class="tab-add" type="button" title="Add tab" aria-label="Add tab">+</button>
        </div>
        <div class="editor-wrapper">
          <div id="line-numbers" class="line-numbers" aria-hidden="true">1</div>
          <textarea id="formats" class="main-textarea" placeholder="Write something great today..."></textarea>
          <div id="find-bar" class="find-bar" role="search" hidden>
            <input
              id="find-input"
              class="find-input"
              type="search"
              maxlength="200"
              placeholder="Find"
              aria-label="Find in current tab"
              autocomplete="off"
            />
            <span id="find-count" class="find-count" aria-live="polite">0/0</span>
            <button
              id="find-previous"
              class="find-action"
              type="button"
              title="Previous match"
              aria-label="Previous match"
            >
              &#8593;
            </button>
            <button id="find-next" class="find-action" type="button" title="Next match" aria-label="Next match">
              &#8595;
            </button>
            <button id="find-close" class="find-action" type="button" title="Close search" aria-label="Close search">
              &#215;
            </button>
          </div>
          <div id="locked-state" class="locked-state" hidden>
            <img class="locked-icon" src="static/svgs/lock.svg" alt="" aria-hidden="true" />
            <div class="locked-title">This tab is locked</div>
            <div class="locked-actions">
              <button id="unlock-tab" class="modal-button modal-button-primary" type="button">
                <img class="icon" src="static/svgs/unlock.svg" alt="" aria-hidden="true" />
                Unlock
              </button>
              <button id="reset-tab" class="modal-button" type="button">Forgot password</button>
            </div>
          </div>
        </div>
        <div class="bottom-bar">
          <div class="text-stats" aria-live="polite">
            <span><span id="word-number">0</span> words</span>
            <span class="stat-separator">&middot;</span>
            <span><span id="text-number">0</span> characters</span>
            <span class="stat-separator">&middot;</span>
            <span><span id="line-number">0</span> lines</span>
          </div>
          <div class="bottom-actions">
            <button class="button" value="save" type="button" id="save">
              <img class="icon" src="static/svgs/download.svg" alt="" aria-hidden="true" />
              Download
            </button>
            <button class="button" type="button" id="copy">
              <img class="icon" src="static/svgs/copy.svg" alt="" aria-hidden="true" />
              Copy
            </button>
          </div>
        </div>
      </div>
    </main>
    <div id="modal-backdrop" class="modal-backdrop" hidden>
      <section
        id="modal"
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
        aria-describedby="modal-message"
      >
        <h2 id="modal-title" class="modal-title"></h2>
        <p id="modal-message" class="modal-message"></p>
        <div id="modal-preview" class="modal-preview" hidden></div>
        <label id="modal-input-label" class="modal-label" for="modal-input"></label>
        <input id="modal-input" class="modal-input" type="text" maxlength="80" autocomplete="off" />
        <label id="modal-input-two-label" class="modal-label" for="modal-input-two"></label>
        <input id="modal-input-two" class="modal-input" type="password" maxlength="80" autocomplete="new-password" />
        <p id="modal-error" class="modal-error" role="alert" hidden></p>
        <div id="modal-options" class="modal-options" hidden></div>
        <div class="modal-actions">
          <button id="modal-cancel" class="modal-button" type="button">Cancel</button>
          <button id="modal-confirm" class="modal-button modal-button-primary" type="button">Confirm</button>
        </div>
      </section>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="tab-context-menu" class="tab-context-menu" role="menu" hidden>
      <button id="context-settings" class="tab-context-item" type="button" role="menuitem">
        <img class="tab-context-icon" src="static/svgs/settings.svg" alt="" aria-hidden="true" />
        Rename
      </button>
      <button id="context-security" class="tab-context-item" type="button" role="menuitem">
        <img id="context-security-icon" class="tab-context-icon" src="static/svgs/lock.svg" alt="" aria-hidden="true" />
        <span id="context-security-label">Set password</span>
      </button>
      <button id="context-delete" class="tab-context-item tab-context-danger" type="button" role="menuitem">
        <img class="tab-context-icon" src="static/svgs/trash.svg" alt="" aria-hidden="true" />
        Delete tab
      </button>
    </div>
    <script src="static/js/driverjs/driver.js.iife.js"></script>
    <script defer type="module" src="static/js/popup.js"></script>
  </body>
</html>
