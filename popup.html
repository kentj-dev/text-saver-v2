<!-- KENT J 2020 -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Format Saver by Kent J.</title>
    <link rel="stylesheet" type="text/css" href="static/css/popup.css" />
  </head>
  <body>
    <main class="main-wrapper">
      <div class="content">
        <header class="app-header">
          <div class="brand">
            <img src="images/128.png" alt="Text Saver logo" class="logo" />
            <div class="extension-info">Text Saver</div>
          </div>
          <div class="header-right">
            <span id="save-status" class="save-status" role="status"></span>
            <div id="header-actions" class="header-actions">
              <button
                id="protect-tab"
                class="header-action"
                type="button"
                title="Set password"
                aria-label="Set password"
              >
                &#128272;
              </button>
              <button id="rename-tab" class="header-action" type="button" title="Rename tab" aria-label="Rename tab">
                ⚙️
              </button>
              <button id="delete-tab" class="header-action" type="button" title="Delete tab" aria-label="Delete tab">
                🗑️
              </button>
            </div>
          </div>
        </header>
        <div class="tabs-toolbar">
          <div id="tabs" class="tabs" role="tablist" aria-label="Saved text tabs"></div>
          <button id="add-tab" class="tab-add" type="button" title="Add tab" aria-label="Add tab">+</button>
        </div>
        <div class="editor-wrapper">
          <div id="line-numbers" class="line-numbers" aria-hidden="true">1</div>
          <textarea
            id="formats"
            class="main-textarea"
            maxlength="200000"
            placeholder="Write something great today..."
          ></textarea>
          <div id="locked-state" class="locked-state" hidden>
            <div class="locked-icon" aria-hidden="true">&#128274;</div>
            <div class="locked-title">This tab is locked</div>
            <div class="locked-actions">
              <button id="unlock-tab" class="modal-button modal-button-primary" type="button">🔓 Unlock</button>
              <button id="reset-tab" class="modal-button" type="button">Forgot password</button>
            </div>
          </div>
        </div>
        <div class="bottom-bar">
          <div class="text-stats" aria-live="polite">
            <span><span id="word-number">0</span> words</span>
            <span class="stat-separator">·</span>
            <span><span id="text-number">0</span> characters</span>
            <span class="stat-separator">·</span>
            <span><span id="line-number">0</span> lines</span>
          </div>
          <div class="bottom-actions">
            <button class="button" value="save" type="button" id="save">Download</button>
            <button class="button" type="button" id="copy">Copy</button>
          </div>
        </div>
      </div>
    </main>
    <div id="modal-backdrop" class="modal-backdrop" hidden>
      <section
        id="modal"
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
        aria-describedby="modal-message"
      >
        <h2 id="modal-title" class="modal-title"></h2>
        <p id="modal-message" class="modal-message"></p>
        <label id="modal-input-label" class="modal-label" for="modal-input"></label>
        <input id="modal-input" class="modal-input" type="text" maxlength="80" autocomplete="off" />
        <label id="modal-input-two-label" class="modal-label" for="modal-input-two"></label>
        <input id="modal-input-two" class="modal-input" type="password" maxlength="80" autocomplete="new-password" />
        <p id="modal-error" class="modal-error" role="alert" hidden></p>
        <div id="modal-options" class="modal-options" hidden></div>
        <div class="modal-actions">
          <button id="modal-cancel" class="modal-button" type="button">Cancel</button>
          <button id="modal-confirm" class="modal-button modal-button-primary" type="button">Confirm</button>
        </div>
      </section>
    </div>
    <script defer type="module" src="static/js/popup.js"></script>
  </body>
</html>
